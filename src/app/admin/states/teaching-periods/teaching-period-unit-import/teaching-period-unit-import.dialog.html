<nz-table #importTable nzBordered [nzData]="unitsToImport" [nzShowPagination]="false">
  <thead>
    <tr>
      <th>Unit Code</th>
      <th>Source Unit</th>
      <th>Unit Name</th>
      <th>Main Convenor</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (unitToImport of importTable.data; track unitToImport.unitCode) {
    <tr>
      <td>
        <input
          nz-input
          [(ngModel)]="unitToImport.unitCode"
          (ngModelChange)="codeChange($event, unitToImport)"
        />
      </td>
      <td>
        <object-select
          placeholder="New Unit"
          [source]="unitToImport.relatedUnits"
          [target]="unitToImport.sourceUnit"
          (targetChange)="changeSourceUnit(unitToImport, $event)"
        ></object-select>
      </td>
      <td>
        @if (unitToImport.sourceUnit) { {{ unitToImport.sourceUnit.name }} } @else {
        <input nz-input placeholder="Unit name" [(ngModel)]="unitToImport.unitName" />
        }
      </td>
      <td>
        <nz-select
          class="w-full min-w-[220px]"
          nzAllowClear
          nzPlaceHolder="Select convenor"
          nzShowSearch
          [(ngModel)]="unitToImport.convenor"
        >
          @for (staff of teachingStaff; track staff.id) {
          <nz-option [nzLabel]="staff.name" [nzValue]="staff"></nz-option>
          }
        </nz-select>
      </td>
      <td>
        <nz-tag
          [nzColor]="unitToImport.done === true ? 'success' : unitToImport.done === false ? 'error' : 'processing'"
        >
          {{ statusForUnit(unitToImport) }}
        </nz-tag>
      </td>
      <td>
        <button nz-button nzDanger nzType="text" (click)="removeUnitToAdd(unitToImport)">
          Remove
        </button>
      </td>
    </tr>
    }
  </tbody>
</nz-table>

<div class="mt-5 flex items-center gap-2">
  <nz-input-group class="max-w-md" nzAddOnBefore="Unit code(s)">
    <input nz-input [(ngModel)]="codesToAdd" (keyup.enter)="addUnitsByCode()" />
  </nz-input-group>
  <button nz-button (click)="addUnitsByCode()">Add</button>
  <span class="flex-grow"></span>
  <button nz-button nzType="primary" [disabled]="!unitsToImport.length" (click)="doImport()">
    Import
  </button>
  <button nz-button (click)="onCloseClick()">Close</button>
</div>
