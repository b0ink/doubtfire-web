<p class="dialog-intro">Enter the D2L identifiers used when transferring grades.</p>

<div class="dialog-fields">
  <label class="field">
    <span>Org Unit ID <span class="required">*</span></span>
    <input pInputText required [(ngModel)]="d2lDataMapping.orgUnitId" />
  </label>
  <label class="field">
    <span>Grade Object ID</span>
    <input pInputText [(ngModel)]="d2lDataMapping.gradeObjectId" />
    <small>Created during grades transfer if not set.</small>
  </label>
</div>

<div class="dialog-actions">
  @if (d2lDataMapping.id) {
    <p-button label="Delete" severity="danger" [outlined]="true" (onClick)="delete()" />
  }
  <p-button
    [label]="
      d2lDataMapping.hasChanges(d2lAssessmentMappingService.mapping) ? 'Save and close' : 'Close'
    "
    (onClick)="saveAndClose()"
  />
</div>
